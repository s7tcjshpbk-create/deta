<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пішли на побачення? ❤️</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffe6e9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
    }
    h1 {
      color: #ff4b6e;
      font-size: 24px;
      margin-bottom: 15px;
    }
    p {
      color: #555;
      font-size: 16px;
    }
    .date-picker-box {
      margin: 20px 0;
    }
    input[type="datetime-local"] {
      padding: 10px;
      font-size: 16px;
      border: 2px solid #ff4b6e;
      border-radius: 10px;
      outline: none;
      color: #333;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 20px;
      position: relative;
      min-height: 50px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    #yesBtn {
      background-color: #28a745;
      color: white;
      font-weight: bold;
    }
    #yesBtn:hover {
      background-color: #218838;
    }
    #noBtn {
      background-color: #dc3545;
      color: white;
      font-weight: bold;
    }
    .success-msg {
      display: none;
      font-size: 20px;
      color: #ff4b6e;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1 id="title">Пішли на побачення? 🌹</h1>
    <p id="subtitle">Обери зручний день та час:</p>

    <div class="date-picker-box" id="dateBox">
      <input type="datetime-local" id="dateTimeInput">
    </div>

    <div class="btn-container" id="btnBox">
      <button id="yesBtn" onclick="acceptDate()">ТАК! 🥰</button>
      <button id="noBtn" onclick="handleNoClick()">Ні 😢</button>
    </div>

    <div class="success-msg" id="successMsg"></div>
  </div>

  <script>
    // Встановлюємо завтрашній день за замовчуванням
    const dateInput = document.getElementById('dateTimeInput');
    const now = new Date();
    now.setDate(now.getDate() + 1);
    now.setHours(19, 0, 0, 0);
    dateInput.value = now.toISOString().slice(0, 16);

    // Смішні та переконливі відповіді при кліку на "Ні"
    const noResponses = [
      'Ти впевнена? 🥺',
      'А може подумаєш? 🤔',
      'Та ну, я ж цей сайт спеціально для цього робив! 💻',
      'Не соромся, просто тисни ТАК! ✨',
      'Додо, ну будь ласка, дай шанс! 🦤❤️',
      'Кнопка "Ні" тут тільки для краси, тисни ТАК! 🌹',
      'Я не здамся, поки ти не погодишся! 😜',
      'Все, "Ні" більше не працює, вибір очевидний! 🚀'
    ];

    let noCount = 0;
    let yesScale = 1;

    function handleNoClick() {
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');

      // Змінюємо текст на кнопці "Ні"
      noBtn.innerText = noResponses[noCount % noResponses.length];
      noCount++;

      // Збільшуємо кнопку "Так"
      yesScale += 0.25;
      yesBtn.style.transform = `scale(${yesScale})`;
    }

    function acceptDate() {
      const selectedDate = dateInput.value;
      if (!selectedDate) {
        alert('Будь ласка, обери дату та час!');
        return;
      }

      const formattedDate = new Date(selectedDate).toLocaleString('uk-UA', {
        dateStyle: 'full',
        timeStyle: 'short'
      });

      document.getElementById('subtitle').style.display = 'none';
      document.getElementById('dateBox').style.display = 'none';
      document.getElementById('btnBox').style.display = 'none';

      const successMsg = document.getElementById('successMsg');
      successMsg.innerHTML = `Ура! Побачення заплановано на:<br><b>${formattedDate}</b> ❤️✨`;
      successMsg.style.display = 'block';

      sendTelegramNotification(formattedDate);
    }

    function sendTelegramNotification(dateText) {
      const token = '8908941684:AAGP6pLR7T2QkGYy0gd1jn6iAkiQdRDkXe0';
      const chatId = '8416117144';
      const text = `🎉 Вона погодилася на побачення! ❤️\n\n📅 Обрана дата й час: ${dateText}`;

      fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          chat_id: chatId,
          text: text
        })
      });
    }
  </script>

</body>
</html>
