<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ти що, образилась? 😂</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      max-width: 450px;
      width: 90%;
      position: relative;
      backdrop-filter: blur(5px);
    }

    h1 {
      color: #ff3366;
      font-size: 2rem;
      margin-bottom: 10px;
      transition: transform 0.2s ease;
    }

    p.subtitle {
      color: #555;
      font-size: 1.15rem;
      margin-bottom: 30px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    .buttons-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 80px;
      position: relative;
    }

    button {
      padding: 12px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    /* Кнопка ТАК - тікає */
    #btn-yes {
      background-color: #ff4757;
      color: white;
      position: absolute;
      transition: all 0.15s ease-out;
    }

    /* Кнопка НІ - звичайна, на яку можна клікати */
    #btn-no {
      background-color: #2ed573;
      color: white;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    #btn-no:hover {
      background-color: #26af5f;
    }

    #btn-no:active {
      transform: scale(0.95);
    }

    .emoji {
      font-size: 4rem;
      margin-bottom: 10px;
      transition: transform 0.3s ease;
    }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    <div class="emoji" id="main-emoji">🥺👉👈</div>
    <h1 id="title">Ти що, обиділась?</h1>
    <p class="subtitle" id="status-text">Скажи чесно, ти на мене дуєшся?</p>

    <div class="buttons-container" id="btn-container">
      <button id="btn-yes">Так 😭</button>
      <button id="btn-no">Ні 😎</button>
    </div>
  </div>

  <script>
    const btnYes = document.getElementById('btn-yes');
    const btnNo = document.getElementById('btn-no');
    const statusText = document.getElementById('status-text');
    const title = document.getElementById('title');
    const mainEmoji = document.getElementById('main-emoji');

    // Набір смішних відповідей при кліку на "Ні"
    const noPhrases = [
      "А чому тоді кнопка «Так» від тебе тікає? 😂",
      "Та ти точно обиділась, я ж бачу! 😜",
      "Та це ж шутка була, ну ти чого! 🙈",
      "Я ж любя, не дуйся! 🎈",
      "Точно ні? А губки чого пантиш? 🥺",
      "Ну слава богу! А то я вже думав купувати кілограм шоколадок 🍫",
      "Все, раз «Ні», то з тебе посмішка! 😁"
    ];

    const emojis = ["🥺👉👈", "😅", "🙈", "🎈", "🥹", "🍫", "❤️🎉"];

    let clickIndex = 0;

    // Натискання на кнопку "Ні" змінює текст та емодзі
    btnNo.addEventListener('click', () => {
      statusText.innerText = noPhrases[clickIndex];
      mainEmoji.innerText = emojis[clickIndex];
      
      // Легкий рух заголовка для ефекту
      title.style.transform = `rotate(${Math.random() * 8 - 4}deg)`;

      clickIndex = (clickIndex + 1) % noPhrases.length;
    });

    // Кнопка "Так" тікає від курсора або пальця
    function moveYesButton() {
      const maxX = 130;
      const maxY = 80;

      const randomX = (Math.random() - 0.5) * maxX * 2;
      const randomY = (Math.random() - 0.5) * maxY * 2;

      btnYes.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    btnYes.addEventListener('mouseover', moveYesButton);
    btnYes.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveYesButton();
    });
  </script>
</body>
</html>
