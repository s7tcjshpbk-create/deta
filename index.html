<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Запрошення на побачення 💌</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: linear-gradient(135deg, #ff9a9e, #fecfef);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  text-align: center;
}

.card {
  background: white;
  padding: 28px 22px;
  border-radius: 20px;
  box-shadow: 0 10px 25px #0002;
  max-width: 420px;
  width: 100%;
  overflow: hidden;
}

h1 {
  color: #d63384;
  margin-bottom: 15px;
  font-size: 25px;
}

p {
  color: #555;
  font-size: 17px;
  margin-bottom: 20px;
}

.btn-container {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  min-height: 100px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

.btn-yes {
  background: #28a745;
  color: white;
  position: relative;
  z-index: 2;
  transition: transform .2s;
}

.btn-no {
  background: #dc3545;
  color: white;
  position: absolute;
  left: 58%;
  top: 25px;
  white-space: nowrap;
  z-index: 3;
  transition: left .15s, top .15s, transform .15s;
}

#funnyMessage {
  min-height: 52px;
  color: #d63384;
  font-weight: bold;
  font-size: 16px;
  margin-top: 10px;
}

.form-group {
  margin-bottom: 16px;
  text-align: left;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
  color: #333;
}

select, input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 16px;
}

.btn-submit {
  background: #d63384;
  color: white;
  width: 100%;
  margin-top: 5px;
  text-decoration: none;
  display: inline-block;
  text-align: center;
}

#step-2 {
  display: none;
}

#status {
  margin-top: 15px;
  font-size: 15px;
  overflow-wrap: anywhere;
  color: #d63384;
}
</style>
</head>

<body>
<div class="card">

  <div id="step-1">
    <h1>Підемо на побачення? 🥺</h1>
    <p>Я дуууже хочу провести з тобою час!</p>

    <div class="btn-container" id="btnContainer">
      <button class="btn-yes" id="btnYes">Так! 🥰</button>
      <button class="btn-no" id="btnNo">Ні 😢</button>
    </div>

    <p id="funnyMessage" aria-live="polite">
      Обирай відповідь дуже уважно 👀
    </p>
  </div>

  <div id="step-2">
    <h1>Урааа! 🎉</h1>
    <p>Ну що, додо, куди й коли вирушаємо? 🦤</p>

    <div class="form-group">
      <label for="placeSelect">Куди підемо?</label>
      <select id="placeSelect">
        <option value="Прогулянка">🌳 Прогулянка</option>
        <option value="Більярд">🎱 Більярд</option>
        <option value="Кафе">☕ Кафе</option>
        <option value="Ресторан">🍝 Ресторан</option>
        <option value="custom">💡 Моя пропозиція</option>
      </select>
    </div>

    <div class="form-group" id="customGroup" style="display:none">
      <label for="customPlace">Твоя пропозиція</label>
      <input id="customPlace" type="text" placeholder="Напиши, куди хочеш піти">
    </div>

    <div class="form-group">
      <label for="dateTime">Дата та час</label>
      <input type="datetime-local" id="dateTime" required>
    </div>

    <a id="sendBtn" class="btn-submit" href="#" target="_blank">
      Підтвердити побачення 💌
    </a>

    <p id="status" aria-live="polite"></p>
  </div>

</div>

<script>
  const BOT_USERNAME = 'dodo_dodo05n_bot';

  const phrases = [
    "Ти серйозно? Я навіть сайт для цього написав! 😭",
    "Додо, ти зараз серйозно натискаєш «Ні»? 🦤",
    "Кнопка на твоєму боці, але я на крок попереду 😈",
    "Може, окуляри потрібні? Там же «Так»! 👀",
    "Я витратив час на сайт, а ти так зі мною?!",
    "Увага! Виявлено критичний рівень додо 🦤",
    "Кнопка «Ні» йде у відпустку 😂",
    "Твій вибір прийнято. Жартую, лови кнопку!",
    "Навіть кнопка не хоче казати «Ні» 🤣",
    "Додо.exe перестав відповідати...",
    "Я це запам'ятаю. Особливо додо запам'ятаю 😭",
    "Всесвіт натякає тобі натиснути «Так» 🌍"
  ];

  let attempts = 0;
  let yesScale = 1;
  let noScale = 1;

  const btnNo = document.getElementById("btnNo");
  const btnYes = document.getElementById("btnYes");
  const container = document.getElementById("btnContainer");

  function moveNoButton(event) {
    if (event) event.preventDefault();

    attempts++;

    document.getElementById("funnyMessage").textContent =
      phrases[(attempts - 1) % phrases.length];

    noScale = Math.max(0.35, noScale - 0.07);
    btnNo.style.transform = `scale(${noScale})`;

    yesScale = Math.min(1.65, yesScale + 0.045);
    btnYes.style.transform = `scale(${yesScale})`;

    const maxX = Math.max(0, container.clientWidth - btnNo.offsetWidth);
    const maxY = Math.max(0, container.clientHeight - btnNo.offsetHeight);

    btnNo.style.left = Math.random() * maxX + "px";
    btnNo.style.top = Math.random() * maxY + "px";
  }

  btnNo.addEventListener("pointerenter", moveNoButton);
  btnNo.addEventListener("touchstart", moveNoButton, {
    passive: false
  });

  btnYes.addEventListener("click", () => {
    document.getElementById("step-1").style.display = "none";
    document.getElementById("step-2").style.display = "block";
  });

  document.getElementById("placeSelect").addEventListener("change", e => {
    document.getElementById("customGroup").style.display =
      e.target.value === "custom" ? "block" : "none";
  });

  document.getElementById("sendBtn").addEventListener("click", (e) => {
    const select = document.getElementById("placeSelect");
    const custom = document.getElementById("customPlace").value.trim();
    const dateTime = document.getElementById("dateTime").value;
    const status = document.getElementById("status");

    const place = select.value === "custom" ? custom : select.value;

    if (!place || !dateTime) {
      e.preventDefault();
      status.textContent = "Обери місце та дату з часом 🥺";
      return;
    }

    if (select.value === "custom" && !custom) {
      e.preventDefault();
      status.textContent = "Напиши свою пропозицію 💡";
      return;
    }

    const dateObj = new Date(dateTime);

    if (Number.isNaN(dateObj.getTime())) {
      e.preventDefault();
      status.textContent = "Перевір правильність дати та часу!";
      return;
    }

    if (dateObj.getTime() < Date.now()) {
      e.preventDefault();
      status.textContent = "Ця дата вже в минулому 😅 Обери майбутню!";
      return;
    }

    const formattedDate = dateObj.toLocaleString("uk-UA", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    });

    const messageText = 
      `💌 НОВА ВІДПОВІДЬ НА ЗАПРОШЕННЯ!\n\n` +
      `🎉 Погодження на побачення!\n` +
      `📍 Місце: ${place}\n` +
      `📅 Дата та час: ${formattedDate}`;

    // Формуємо посилання на Telegram з готовим текстом
    const telegramUrl = `https://t.me/${BOT_USERNAME}?text=` + encodeURIComponent(messageText);
    document.getElementById("sendBtn").href = telegramUrl;
    
    status.textContent = "Відкриваємо Telegram... Натисніть «Надіслати» 💌";
  });
</script>
</body>
</html>
