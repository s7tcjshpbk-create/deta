<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запрошення на побачення 💌</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      position: relative;
    }
    h1 {
      color: #d63384;
      margin-bottom: 15px;
      font-size: 24px;
    }
    p {
      color: #555;
      font-size: 18px;
      margin-bottom: 25px;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      min-height: 80px;
    }
    button, .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }
    .btn-yes {
      background-color: #28a745;
      color: white;
    }
    .btn-no {
      background-color: #dc3545;
      color: white;
    }
    .btn-submit {
      background-color: #d63384;
      color: white;
      width: 100%;
      margin-top: 15px;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: bold;
    }
    select, input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    #step-2 {
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- КРОК 1: Запрошення -->
    <div id="step-1">
      <h1>Підемо на побачення? 🥺</h1>
      <p>Я дуууже хочу провести з тобою час!</p>
      <div class="btn-container">
        <button class="btn btn-yes" id="btnYes" onclick="goToStep2()">Так! 🥰</button>
        <button class="btn btn-no" id="btnNo">Ні 😢</button>
      </div>
    </div>

    <!-- КРОК 2: Вибір дати та місця -->
    <div id="step-2">
      <h1>Ура! 🎉 Куди та коли?</h1>
      
      <div class="form-group">
        <label for="placeSelect">Оберіть місце:</label>
        <select id="placeSelect" onchange="toggleCustomPlace(this.value)">
          <option value="Ресторан / Кав'ярня">☕ Ресторан / Кав'ярня</option>
          <option value="Прогулянка в парку">🌳 Прогулянка в парку</option>
          <option value="Кінотеатр">🎬 Кінотеатр</option>
          <option value="Боулінг / Більярд">🎱 Боулінг / Більярд</option>
          <option value="custom">✏️ Власне місце...</option>
        </select>
      </div>

      <div class="form-group" id="customPlaceInput" style="display: none;">
        <label for="customPlace">Введіть свій варіант:</label>
        <input type="text" id="customPlace" placeholder="Наприклад: Пікнік біля річки">
      </div>

      <div class="form-group">
        <label for="dateTime">Оберіть дату та час:</label>
        <input type="datetime-local" id="dateTime">
      </div>

      <button class="btn btn-submit" onclick="sendData()">Відправити 🚀</button>
    </div>
  </div>

  <script>
    // Актуальні налаштування бота
    const TELEGRAM_BOT_TOKEN = '8908941684:AAGP6pLR7T2QkGYy0gd1jn6iAkiQdRDkXe0';
    const TELEGRAM_CHAT_ID = '8416117144';

    const phrases = [
      "Ти що, додо? 🦤",
      "Та ти що, я ж спеціально для цього сайт писав!",
      "Додо, кнопка 'Ні' тут зламалася, тисни 'Так'!",
      "Ти що, реально додо? Натискай 'Так'! 😜",
      "Ні-ні-ні, цей варіант не приймається! 🚫",
      "Я буду збільшувати кнопку 'Так', поки ти не натиснеш!",
      "Ну ти й додо, кнопка 'Так' вже на пів екрану!"
    ];

    let phraseIndex = 0;
    let yesScale = 1;

    const btnNo = document.getElementById('btnNo');
    const btnYes = document.getElementById('btnYes');

    function moveNoButton() {
      phraseIndex = (phraseIndex + 1) % phrases.length;
      btnNo.innerText = phrases[phraseIndex];

      yesScale += 0.3;
      btnYes.style.transform = `scale(${yesScale})`;
    }

    btnNo.addEventListener('mouseover', moveNoButton);
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    function goToStep2() {
      document.getElementById('step-1').style.display = 'none';
      document.getElementById('step-2').style.display = 'block';
    }

    function toggleCustomPlace(val) {
      const customInput = document.getElementById('customPlaceInput');
      if (val === 'custom') {
        customInput.style.display = 'block';
      } else {
        customInput.style.display = 'none';
      }
    }

    function sendData() {
      const placeSelect = document.getElementById('placeSelect').value;
      const customPlace = document.getElementById('customPlace').value;
      const dateTime = document.getElementById('dateTime').value;

      let finalPlace = placeSelect;
      if (placeSelect === 'custom') {
        finalPlace = customPlace ? customPlace : 'Власне місце';
      }

      if (!dateTime || !finalPlace) {
        alert('Будь ласка, заповніть усі поля!');
        return;
      }

      // Форматування дати
      const dateObj = new Date(dateTime);
      const formattedDate = dateObj.toLocaleString('uk-UA', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });

      const messageText = `🎉 Нова відповідь на запрошення!\n\n📅 Дата та час: ${formattedDate}\n📍 Місце: ${finalPlace}`;
      const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(messageText)}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.ok) {
            alert('Ура! Відповідь успішно надіслана! 🎉');
          } else {
            alert('Помилка Telegram API: ' + data.description);
          }
        })
        .catch(err => {
          console.error(err);
          alert('Помилка мережі. Переконайтеся, що ви натиснули /start у чаті з ботом!');
        });
    }
  </script>
</body>
</html>
