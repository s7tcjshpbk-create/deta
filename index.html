<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ти що, образилася? 😂</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      max-width: 450px;
      width: 90%;
      position: relative;
      backdrop-filter: blur(5px);
    }

    h1 {
      color: #ff3366;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    p.subtitle {
      color: #555;
      font-size: 1.1rem;
      margin-bottom: 30px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .buttons-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 80px;
      position: relative;
    }

    button, .redirect-btn {
      padding: 12px 28px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      text-decoration: none;
      display: inline-block;
    }

    #btn-yes {
      background-color: #ff4757;
      color: white;
      transform-origin: center;
    }

    #btn-yes:hover {
      background-color: #ff6b81;
    }

    #btn-no {
      background-color: #2ed573;
      color: white;
      position: absolute;
      transition: all 0.15s ease-out;
    }

    .redirect-btn {
      background-color: #0088cc; /* Колір Telegram */
      color: white;
      margin-top: 15px;
    }

    .emoji {
      font-size: 4rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="card" id="main-card">
    <div class="emoji" id="main-emoji">🥺👉👈</div>
    <h1 id="title">Ти що, образилась?</h1>
    <p class="subtitle" id="status-text">Скажи чесно, тільки без цього вашого «все нормально»...</p>

    <div class="buttons-container" id="btn-container">
      <button id="btn-yes">Да 😭</button>
      <button id="btn-no">Ні 😎</button>
    </div>

    <div id="redirect-container" style="display: none;">
      <a id="bot-link" href="#" target="_blank" class="redirect-btn">Перейти в бот 🤖</a>
    </div>
  </div>

  <script>
    // 🔗 ВСТАВТЕ СЮДИ ПОСИЛАННЯ НА ВАШОГО БОТА (Telegram / TikTok):
    const BOT_URL = "https://t.me/your_bot_username"; // Змініть на своє посилання!

    const btnYes = document.getElementById('btn-yes');
    const btnNo = document.getElementById('btn-no');
    const statusText = document.getElementById('status-text');
    const title = document.getElementById('title');
    const mainEmoji = document.getElementById('main-emoji');
    const btnContainer = document.getElementById('btn-container');
    const redirectContainer = document.getElementById('redirect-container');
    const botLink = document.getElementById('bot-link');

    // Налаштовуємо посилання
    botLink.href = BOT_URL;

    // Смішні фрази при натисканні на "Да"
    const yesPhrases = [
      "Ти що, я ж пошутив! 😅",
      "Ну це ж шутка була, ти чого! 🙈",
      "Зачекай, кнопка зменшується, бачиш? 🤏",
      "Ей, ну не дуйся! 🎈",
      "Та я ж любя! 🥹",
      "Все, переходимо миритись у бот! 😂"
    ];

    let clickCount = 0;
    let currentScale = 1;

    // Кнопка "Да" зменшується
    btnYes.addEventListener('click', () => {
      clickCount++;
      currentScale -= 0.18; // Швидкість зменшення

      if (currentScale > 0.25) {
        btnYes.style.transform = `scale(${currentScale})`;
        
        const phraseIndex = Math.min(clickCount - 1, yesPhrases.length - 1);
        statusText.innerText = yesPhrases[phraseIndex];
        
        title.style.transform = `rotate(${Math.random() * 6 - 3}deg)`;
      } else {
        showVictoryScreen();
      }
    });

    // Кнопка "Ні" тікає
    function moveNoButton() {
      const maxX = 140;
      const maxY = 90;

      const randomX = (Math.random() - 0.5) * maxX * 2;
      const randomY = (Math.random() - 0.5) * maxY * 2;

      btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    btnNo.addEventListener('mouseover', moveNoButton);
    btnNo.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    // Фінал + Перехід у бот
    function showVictoryScreen() {
      mainEmoji.innerText = "❤️🎉";
      title.innerText = "Ура, мир!";
      statusText.innerText = "Я ж казав, що це жарт! Переходимо в бот... 🚀";
      btnContainer.style.display = 'none';
      redirectContainer.style.display = 'block';

      // Автоматичне перенаправлення через 1.5 секунди
      setTimeout(() => {
        window.location.href = BOT_URL;
      }, 1500);
    }
  </script>
</body>
</html>
