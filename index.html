<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запрошення на побачення 💌</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: "Segoe UI", sans-serif;
}

body {
  background: linear-gradient(135deg, #ff9a9e, #fecfef);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  text-align: center;
}

.card {
  background: white;
  padding: 28px 20px;
  border-radius: 20px;
  box-shadow: 0 10px 25px #0002;
  max-width: 420px;
  width: 100%;
  overflow: hidden;
}

h1 {
  color: #d63384;
  margin-bottom: 15px;
  font-size: 25px;
}

p {
  color: #555;
  font-size: 17px;
  margin-bottom: 20px;
}

.btn-container {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 25px;
  min-height: 100px;
}

button {
  padding: 12px 20px;
  font-size: 16px;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

.btn-yes {
  background: #28a745;
  color: white;
  transition: transform .2s;
  position: relative;
  z-index: 2;
}

.btn-no {
  background: #dc3545;
  color: white;
  position: absolute;
  left: 58%;
  top: 25px;
  white-space: nowrap;
  transition: left .15s, top .15s, transform .15s;
  z-index: 3;
}

#funnyMessage {
  min-height: 55px;
  color: #d63384;
  font-weight: bold;
  font-size: 15px;
}

.form-group {
  margin-bottom: 16px;
  text-align: left;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
}

select, input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 9px;
  font-size: 16px;
}

.btn-submit {
  background: #d63384;
  color: white;
  width: 100%;
}

.btn-submit:disabled {
  opacity: .6;
}

#step-2 {
  display: none;
}

#status {
  margin-top: 15px;
  font-size: 15px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<div class="card">

  <section id="step-1">
    <h1>Підемо на побачення? 🥺</h1>
    <p>Я дуууже хочу провести з тобою час!</p>

    <div class="btn-container" id="btnContainer">
      <button class="btn-yes" id="btnYes">Так! 🥰</button>
      <button class="btn-no" id="btnNo">Ні 😢</button>
    </div>

    <p id="funnyMessage">Обирай відповідь уважно 👀</p>
  </section>

  <section id="step-2">
    <h1>Урааа! 🎉</h1>
    <p>Ну що, додо, куди й коли? 🦤</p>

    <div class="form-group">
      <label for="placeSelect">Куди підемо?</label>
      <select id="placeSelect">
        <option value="Прогулянка">🌳 Прогулянка</option>
        <option value="Більярд">🎱 Більярд</option>
        <option value="Кафе">☕ Кафе</option>
        <option value="Ресторан">🍝 Ресторан</option>
        <option value="custom">💡 Моя пропозиція</option>
      </select>
    </div>

    <div class="form-group" id="customGroup" style="display:none">
      <label for="customPlace">Твоя пропозиція</label>
      <input id="customPlace" maxlength="300"
             placeholder="Напиши, куди хочеш піти">
    </div>

    <div class="form-group">
      <label for="dateTime">Дата та час</label>
      <input type="datetime-local" id="dateTime" required>
    </div>

    <button class="btn-submit" id="sendBtn">
      Підтвердити побачення 💌
    </button>

    <p id="status" aria-live="polite"></p>
  </section>

</div>

<script>
// Після публікації Cloudflare Worker встав сюди його адресу.
const SERVER_URL = "ВСТАВ_АДРЕСУ_CLOUDFLARE_WORKER";

const phrases = [
  "Ти серйозно? Я навіть сайт для цього написав! 😭",
  "Додо, ти зараз серйозно натискаєш «Ні»? 🦤",
  "Може, окуляри потрібні? Там же «Так»! 👀",
  "Кнопка «Ні» йде у відпустку 😂",
  "Я витратив час на сайт, а ти так зі мною?!",
  "Виявлено критичний рівень додо 🦤",
  "Навіть кнопка не хоче казати «Ні» 🤣",
  "Додо.exe перестав відповідати...",
  "Я це запам'ятаю. Особливо додо запам'ятаю 😭",
  "Всесвіт натякає тобі натиснути «Так» 🌍",
  "Ти серйозно? А хто тоді їстиме зі мною? 😭"
];

let attempts = 0;
let yesScale = 1;
let noScale = 1;

const btnNo = document.getElementById("btnNo");
const btnYes = document.getElementById("btnYes");
const container = document.getElementById("btnContainer");

function moveNoButton(event) {
  if (event) event.preventDefault();

  attempts++;

  document.getElementById("funnyMessage").textContent =
    phrases[(attempts - 1) % phrases.length];

  noScale = Math.max(0.35, noScale - 0.07);
  btnNo.style.transform = `scale(${noScale})`;

  yesScale = Math.min(1.65, yesScale + 0.045);
  btnYes.style.transform = `scale(${yesScale})`;

  const maxX = Math.max(0, container.clientWidth - btnNo.offsetWidth);
  const maxY = Math.max(0, container.clientHeight - btnNo.offsetHeight);

  btnNo.style.left = Math.random() * maxX + "px";
  btnNo.style.top = Math.random() * maxY + "px";
}

btnNo.addEventListener("pointerenter", moveNoButton);
btnNo.addEventListener("touchstart", moveNoButton, { passive: false });

btnYes.addEventListener("click", () => {
  document.getElementById("step-1").style.display = "none";
  document.getElementById("step-2").style.display = "block";
});

document.getElementById("placeSelect").addEventListener("change", e => {
  document.getElementById("customGroup").style.display =
    e.target.value === "custom" ? "block" : "none";
});

document.getElementById("sendBtn").addEventListener("click", async () => {
  const select = document.getElementById("placeSelect");
  const custom = document.getElementById("customPlace").value.trim();
  const dateTime = document.getElementById("dateTime").value;
  const status = document.getElementById("status");
  const sendBtn = document.getElementById("sendBtn");

  const place = select.value === "custom" ? custom : select.value;

  if (!place || !dateTime) {
    status.textContent = "Обери місце, дату та час 🥺";
    return;
  }

  if (select.value === "custom" && !custom) {
    status.textContent = "Напиши свою пропозицію 💡";
    return;
  }

  if (new Date(dateTime).getTime() < Date.now()) {
    status.textContent = "Обери дату в майбутньому 😅";
    return;
  }

  const formattedDate = new Date(dateTime).toLocaleString("uk-UA", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });

  if (SERVER_URL.startsWith("ВСТАВ_")) {
    status.textContent = "Спочатку налаштуй адресу Telegram-сервера.";
    return;
  }

  sendBtn.disabled = true;
  status.textContent = "Надсилаємо повідомлення... 💌";

  try {
    const response = await fetch(SERVER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        place,
        dateTime: formattedDate
      })
    });

    const result = await response.json();

    if (!response.ok || !result.ok) {
      throw new Error(result.error || "Помилка надсилання");
    }

    status.textContent =
      "Урааа! Повідомлення відправлено! 💗🦤";
    sendBtn.textContent = "Відправлено 💌";
  } catch (error) {
    console.error(error);
    status.textContent =
      "Не вдалося надіслати 😢 Перевір налаштування сервера.";
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
```
